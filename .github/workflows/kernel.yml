name: Kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils
      - name: Test physical frame allocator
        run: bash scripts/test-frame-allocator.sh
      - name: Build freestanding C kernel
        run: bash scripts/build-kernel.sh
      - name: Validate kernel ELF load layout
        run: bash scripts/check-kernel-elf.sh

  qemu-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boot-test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld xorriso qemu-system-x86 git make
      - name: Build Limine bootloader
        run: |
          git clone --depth=1 --branch=v8.x-binary https://github.com/limine-bootloader/limine.git limine
          make -C limine
      - name: Build bootable ISO
        run: LIMINE_DIR="$PWD/limine" bash scripts/build-iso.sh
      - name: Boot ChatOS in QEMU
        run: bash scripts/test-qemu-boot.sh
      - name: Test CPU exception handling in QEMU
        env:
          LIMINE_DIR: ${{ github.workspace }}/limine
          CHATOS_EXCEPTION_SELF_TEST: "1"
          EXPECTED_SERIAL_MARKER: "!!! CHATOS CPU EXCEPTION !!!"
          EXPECTED_PANIC_MARKER: "CPU exception is fatal; system halted."
        run: |
          bash scripts/build-iso.sh
          bash scripts/test-qemu-boot.sh
      - name: Test PIT hardware interrupts in QEMU
        env:
          LIMINE_DIR: ${{ github.workspace }}/limine
          CHATOS_TIMER_SELF_TEST: "1"
          EXPECTED_SERIAL_MARKER: "PIT timer: 5 ticks received."
        run: |
          bash scripts/build-iso.sh
          bash scripts/test-qemu-boot.sh
      - name: Upload serial boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatos-qemu-serial-log
          path: |
            build/qemu-serial.log
            build/qemu-debug.log
            build/qemu-machine.log
          if-no-files-found: ignore
