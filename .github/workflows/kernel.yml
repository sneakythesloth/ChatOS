name: Kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Test physical frame allocator
        run: bash scripts/test-frame-allocator.sh
      - name: Build freestanding C kernel
        run: bash scripts/build-kernel.sh
